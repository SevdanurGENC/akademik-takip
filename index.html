<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Akademik Takip</title>
<style>
:root{
  --bg:#f5f6f8;--surface:#fff;--surface2:#f0f2f5;--text:#1a1e24;--muted:#5d6876;--border:#e1e5eb;
  --accent:#2952d9;--accent-ink:#fff;--accent-soft:#e7ecfd;
  --draft:#5f6773;--draft-bg:#eceef2;--active:#1c5ccc;--active-bg:#e3edfc;--action:#9a5300;--action-bg:#fcefd9;
  --success:#157545;--success-bg:#def3e7;--fail:#b3261e;--fail-bg:#fbe5e3;
  --makale:#6b46d6;--bildiri:#0d8383;--proje:#c0430d;
  --radius:12px;--shadow:0 1px 2px rgba(16,24,40,.05),0 2px 6px rgba(16,24,40,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111418;--surface:#191d23;--surface2:#21262d;--text:#e7eaee;--muted:#9aa4b1;--border:#2c323b;
  --accent:#7d9bff;--accent-ink:#0d1220;--accent-soft:#1f2a47;
  --draft:#a5adb8;--draft-bg:#272c33;--active:#8fb4ff;--active-bg:#1b2a44;--action:#f2b766;--action-bg:#3a2a12;
  --success:#6fd39d;--success-bg:#163323;--fail:#ff8a80;--fail-bg:#3d1b19;
  --makale:#a78bfa;--bildiri:#4fd1c5;--proje:#fb923c;--shadow:none;color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#111418;--surface:#191d23;--surface2:#21262d;--text:#e7eaee;--muted:#9aa4b1;--border:#2c323b;
  --accent:#7d9bff;--accent-ink:#0d1220;--accent-soft:#1f2a47;
  --draft:#a5adb8;--draft-bg:#272c33;--active:#8fb4ff;--active-bg:#1b2a44;--action:#f2b766;--action-bg:#3a2a12;
  --success:#6fd39d;--success-bg:#163323;--fail:#ff8a80;--fail-bg:#3d1b19;
  --makale:#a78bfa;--bildiri:#4fd1c5;--proje:#fb923c;--shadow:none;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.25}
h1{font-size:1.45rem;font-weight:650;letter-spacing:-.01em}
h2{font-size:1.1rem;font-weight:650}
h3{font-size:1rem;font-weight:600}
code{background:var(--surface2);padding:1px 5px;border-radius:5px;font-size:.88em}
a{color:var(--accent)}
.muted{color:var(--muted)}.small{font-size:.85rem}
.hidden{display:none!important}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--surface);padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:550;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--fail);border-color:color-mix(in srgb,var(--fail) 35%,var(--border))}
.btn.block{width:100%;justify-content:center;padding:11px}
.btn:disabled{opacity:.6;cursor:progress}
.link{background:none;border:0;color:var(--accent);cursor:pointer;padding:6px 0;font-size:.9rem}
.icon{border:1px solid var(--border);background:var(--surface);width:38px;height:38px;border-radius:9px;display:inline-grid;place-items:center;cursor:pointer;color:var(--muted)}
.icon:hover{background:var(--surface2);color:var(--text)}
.icon svg{width:18px;height:18px}

/* auth */
.auth{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.auth-card{width:100%;max-width:380px;padding:28px;display:flex;flex-direction:column;gap:14px}
.auth-card.wide{max-width:640px}
.logo{width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.logo svg{width:24px;height:24px}
.err{color:var(--fail);font-size:.9rem;min-height:1em}
.err:empty{display:none}
.warn{background:var(--action-bg);color:var(--action);padding:10px 12px;border-radius:9px;font-size:.9rem}
.note{background:var(--surface2);padding:10px 12px;border-radius:9px;font-size:.88rem;color:var(--muted)}

/* forms */
.fld{display:flex;flex-direction:column;gap:5px;font-size:.85rem;color:var(--muted);font-weight:550}
.fld>span{display:flex;justify-content:space-between;gap:8px}
.fld small{font-weight:400}
input[type=text],input[type=password],input[type=date],input[type=number],input[type=search],select,textarea{
  width:100%;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:9px 11px;color:var(--text);font-weight:400;font-size:.95rem}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:0;border-color:var(--accent)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.grid .full{grid-column:1/-1}
@media (max-width:560px){.grid{grid-template-columns:1fr}}
.seg{display:inline-flex;background:var(--surface2);border-radius:10px;padding:3px;gap:2px;border:0;margin:0;flex-wrap:wrap}
.seg label{cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;padding:6px 14px;border-radius:8px;font-weight:550;font-size:.9rem;color:var(--muted)}
.seg input:checked+span{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.seg input:focus-visible+span{outline:2px solid var(--accent)}

/* shell */
.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.top-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:9px;font-weight:650}
.brand .logo{width:32px;height:32px;border-radius:9px}
.brand .logo svg{width:18px;height:18px}
.tabs{display:flex;gap:2px;overflow-x:auto;flex:1;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:8px 12px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:550;white-space:nowrap}
.tab:hover{background:var(--surface2);color:var(--text)}
.tab.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.tab .cnt{font-size:.75rem;color:var(--muted);margin-left:4px}
.top-actions{display:flex;align-items:center;gap:8px}
.savestate{font-size:.8rem;color:var(--muted);white-space:nowrap}
.savestate.err{color:var(--fail)}
.savestate::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--success);margin-right:6px;vertical-align:1px}
.savestate.pending::before,.savestate.saving::before{background:var(--action)}
.savestate.err::before{background:var(--fail)}
@media (max-width:760px){
  .top-in{flex-wrap:wrap;gap:8px}
  .tabs{order:3;flex-basis:100%}
  .brand span{display:none}
  .top-actions{margin-left:auto}
  .savestate{display:none}
  .hide-sm{display:none}
}
main{max-width:1180px;margin:0 auto;padding:22px 16px 80px}

/* chips & badges */
.badge{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.c-draft{color:var(--draft);background:var(--draft-bg)}
.c-active{color:var(--active);background:var(--active-bg)}
.c-action{color:var(--action);background:var(--action-bg)}
.c-success{color:var(--success);background:var(--success-bg)}
.c-fail{color:var(--fail);background:var(--fail-bg)}
.tchip{font-size:.72rem;font-weight:650;text-transform:uppercase;letter-spacing:.04em}
.t-makale{color:var(--makale)}.t-bildiri{color:var(--bildiri)}.t-proje{color:var(--proje)}

/* dashboard */
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px}
@media (max-width:760px){.stats{grid-template-columns:1fr}}
.stat{padding:16px;cursor:pointer;text-align:left;border:1px solid var(--border);background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);border-top:3px solid var(--tc)}
.stat:hover{border-color:color-mix(in srgb,var(--tc) 40%,var(--border))}
.stat .num{font-size:1.9rem;font-weight:700;line-height:1.1;margin:4px 0 8px}
.stat .row{display:flex;gap:6px;flex-wrap:wrap}
.panels{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:860px){.panels{grid-template-columns:1fr}}
.panel{padding:16px}
.panel h2{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.panel h2 .n{font-size:.8rem;color:var(--muted);font-weight:500}
.panel .empty{color:var(--muted);font-size:.9rem;padding:6px 0}
.mini{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--border);padding:9px 2px;cursor:pointer}
.mini:first-of-type{border-top:0}
.mini:hover .mini-title{color:var(--accent)}
.mini-title{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.mini-sub{display:block;font-size:.8rem;color:var(--muted);font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini-right{font-size:.8rem;color:var(--muted);white-space:nowrap;text-align:right}
.due-over{color:var(--fail)!important;font-weight:600}
.due-soon{color:var(--action)!important;font-weight:600}

/* list */
.toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.toolbar input{flex:1 1 240px}
.toolbar select{flex:0 1 220px;width:auto}
.sumrow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.sumrow button{border:0;cursor:pointer}
.sumrow button.on{outline:2px solid currentColor}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
@media (max-width:400px){.items{grid-template-columns:1fr}}
.item{padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;gap:6px;border-left:3px solid var(--sc)}
.item:hover{border-color:var(--border);border-left-color:var(--sc);box-shadow:0 4px 14px rgba(16,24,40,.08)}
.item-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.item h3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.venue{color:var(--muted);font-size:.9rem}
.meta{display:flex;flex-direction:column;gap:1px;font-size:.8rem;color:var(--muted);margin-top:2px}
.ext{font-size:.85rem;font-weight:550;text-decoration:none;align-self:flex-start;margin-top:2px}
.ext:hover{text-decoration:underline}
.emptybox{padding:40px 16px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:var(--radius)}

/* modal */
.modal{position:fixed;inset:0;z-index:50}
.backdrop{position:absolute;inset:0;background:rgba(10,14,20,.45);display:flex;align-items:flex-start;justify-content:center;padding:5vh 12px;overflow-y:auto}
.dialog{background:var(--surface);border-radius:14px;width:100%;max-width:620px;box-shadow:0 20px 60px rgba(0,0,0,.3);border:1px solid var(--border)}
.dialog.wide{max-width:780px}
.dlg-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 20px 12px}
.dlg-body{padding:4px 20px 18px;display:flex;flex-direction:column;gap:16px}
.dlg-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--border)}
.x{border:0;background:none;font-size:1.6rem;line-height:1;cursor:pointer;color:var(--muted);padding:0 4px}
.form .grid{padding:4px 20px 18px}
.form .seg{margin:0 20px 14px}
.dtitle{font-size:1.2rem;font-weight:650;margin:6px 0 0}
.drow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
dl.kv{display:grid;grid-template-columns:minmax(120px,200px) 1fr;gap:6px 14px;margin:0;font-size:.92rem}
dl.kv dt{color:var(--muted)}
dl.kv dd{margin:0;word-break:break-word}
@media (max-width:520px){dl.kv{grid-template-columns:1fr}dl.kv dd{margin-bottom:6px}}
.notes{white-space:pre-wrap;background:var(--surface2);padding:10px 12px;border-radius:9px;font-size:.92rem}
.box{border:1px solid var(--border);border-radius:11px;padding:14px}
.box h3{margin-bottom:10px}
.evform{display:grid;grid-template-columns:150px 1fr;gap:10px}
.evform .full{grid-column:1/-1}
@media (max-width:520px){.evform{grid-template-columns:1fr}}
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl li{position:relative;padding:0 0 14px 22px}
.tl li::before{content:"";position:absolute;left:5px;top:16px;bottom:0;width:2px;background:var(--border)}
.tl li:last-child::before{display:none}
.tl .dot{position:absolute;left:0;top:5px;width:12px;height:12px;border-radius:50%;border:2px solid currentColor;background:var(--surface)}
.tl .when{font-size:.8rem;color:var(--muted)}
.tl .n{font-size:.9rem;white-space:pre-wrap;margin-top:2px}
.tl .del{float:right;border:0;background:none;color:var(--muted);cursor:pointer;font-size:.8rem}
.tl .del:hover{color:var(--fail)}

/* settings */
.set{display:grid;gap:14px;max-width:760px}
.set .card{padding:18px}
.set .card h2{margin-bottom:8px}
.set .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.9rem;z-index:100;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
.toast.err{background:var(--fail);color:#fff}
.spin{display:grid;place-items:center;min-height:100vh;color:var(--muted)}
</style>
</head>
<body>
<div id="app"><div class="spin">Yükleniyor…</div></div>
<div id="modal" class="modal hidden"></div>
<noscript>Bu uygulama JavaScript gerektirir.</noscript>
<script>
'use strict';
/* ================== Ayarlar ================== */
const ITER = 600000;                  // PBKDF2 tur sayısı
const STALE_DAYS = 60;                // "uzun süredir haber yok" eşiği
const LS = { vault:'akt_vault', data:'akt_data', lock:'akt_lock_min', theme:'akt_theme' };

const ST = (k,t,c)=>({k,t,c});
const TYPES = {
  makale:{
    label:'Makale', plural:'Makaleler', venue:'Dergi', refLabel:'Makale no (Manuscript ID)', linkLabel:'Gönderim sistemi linki',
    venueList:[],
    statuses:[
      ST('hazirlaniyor','Hazırlanıyor','draft'), ST('gonderildi','Gönderildi','active'),
      ST('on_inceleme','Editör / ön inceleme','active'), ST('hakemde','Hakem değerlendirmesinde','active'),
      ST('minor','Minör revizyon','action'), ST('major','Majör revizyon','action'),
      ST('rev_gonderildi','Revizyon gönderildi','active'), ST('kabul','Kabul edildi','success'),
      ST('yayinlandi','Yayımlandı','success'), ST('ret','Reddedildi','fail'), ST('geri_cekildi','Geri çekildi','fail')
    ],
    extra:[
      {k:'index',t:'Dizin',type:'select',opts:['','SSCI','SCIE','AHCI','ESCI','Scopus','TR Dizin','Diğer']},
      {k:'doi',t:'DOI'}
    ]
  },
  bildiri:{
    label:'Bildiri', plural:'Bildiriler', venue:'Kongre / sempozyum', refLabel:'Bildiri no', linkLabel:'Kongre / gönderim linki',
    venueList:[],
    statuses:[
      ST('hazirlaniyor','Hazırlanıyor','draft'), ST('ozet_gonderildi','Özet gönderildi','active'),
      ST('ozet_kabul','Özet kabul edildi','action'), ST('tam_metin','Tam metin gönderildi','active'),
      ST('degerlendirmede','Değerlendirmede','active'), ST('kabul','Kabul edildi','success'),
      ST('sunuldu','Sunuldu','success'), ST('yayinlandi','Bildiri kitabında yayımlandı','success'),
      ST('ret','Reddedildi','fail'), ST('geri_cekildi','Geri çekildi','fail')
    ],
    extra:[
      {k:'eventDate',t:'Etkinlik tarihi',type:'date'}, {k:'location',t:'Yer'},
      {k:'presType',t:'Sunum türü',type:'select',opts:['','Sözlü','Poster','Çevrimiçi','Davetli']},
      {k:'pubType',t:'Yayın şekli',type:'select',opts:['','Özet','Tam metin','Yayımlanmayacak']}
    ]
  },
  proje:{
    label:'Proje', plural:'Projeler', venue:'Kurum / program', refLabel:'Başvuru / proje no', linkLabel:'Başvuru sistemi linki',
    venueList:['TÜBİTAK 1001','TÜBİTAK 1002-A','TÜBİTAK 1002-B','TÜBİTAK 1005','TÜBİTAK 3001','TÜBİTAK 3501','TÜBİTAK 1512','TÜBİTAK 2209-A','TÜBİTAK 2209-B','TÜBİTAK 2219','TÜBİTAK 2224-A','BAP','Kalkınma Ajansı','Ufuk Avrupa','Erasmus+'],
    statuses:[
      ST('hazirlaniyor','Hazırlanıyor','draft'), ST('basvuruldu','Başvuru yapıldı','active'),
      ST('on_degerlendirme','Ön / idari inceleme','active'), ST('panel','Panel değerlendirmesinde','active'),
      ST('ek_bilgi','Ek bilgi / revizyon istendi','action'), ST('desteklendi','Desteklenmesine karar verildi','success'),
      ST('yurutuluyor','Yürütülüyor','success'), ST('tamamlandi','Tamamlandı','success'),
      ST('desteklenmedi','Desteklenmedi','fail'), ST('geri_cekildi','Geri çekildi','fail')
    ],
    extra:[
      {k:'role',t:'Rolüm',type:'select',opts:['','Yürütücü','Araştırmacı','Danışman','Bursiyer']},
      {k:'budget',t:'Bütçe'}, {k:'duration',t:'Süre (ay)',type:'number'}, {k:'startDate',t:'Başlangıç tarihi',type:'date'}
    ]
  }
};
const CATS = { draft:'Hazırlanıyor', active:'Süreçte', action:'Aksiyon bekliyor', success:'Olumlu', fail:'Olumsuz' };
const CAT_ORDER = ['action','active','draft','success','fail'];

/* ================== Yardımcılar ================== */
const $ = s => document.querySelector(s);
const $app = $('#app');
const enc = new TextEncoder(), dec = new TextDecoder();
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)+Math.random().toString(36).slice(2));
const lower = s => String(s ?? '').toLocaleLowerCase('tr');
const todayISO = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset()*6e4).toISOString().slice(0,10); };
const daysBetween = (a,b) => Math.round((Date.parse(b) - Date.parse(a)) / 864e5);
const ago = d => daysBetween(d, todayISO());
const fmt = d => { if(!d) return ''; const [y,m,dd] = d.split('-'); return dd && m ? `${dd}.${m}.${y}` : d; };
const rel = n => n === 0 ? 'bugün' : n === 1 ? 'dün' : n === -1 ? 'yarın' : n > 0 ? `${n} gün önce` : `${-n} gün sonra`;
const dur = n => { if(n < 0) return `${-n} gün sonra`; if(n < 60) return `${n} gün`; const m = Math.floor(n/30.44); return m < 24 ? `${n} gün (~${m} ay)` : `${n} gün (~${(n/365.25).toFixed(1)} yıl)`; };
const safeUrl = u => { u = String(u||'').trim(); if(!u) return ''; if(!/^[a-z][a-z0-9+.-]*:/i.test(u)) u = 'https://' + u; return /^https?:/i.test(u) ? u : ''; };
const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
const lsSet = (k,v) => { try { localStorage.setItem(k,v); return true; } catch { return false; } };
const lsDel = k => { try { localStorage.removeItem(k); } catch {} };
const ICON = {

let toastTimer;
function toast(msg, kind){

/* ================== Şifreleme (AES-GCM + PBKDF2) ================== */
const b64 = buf => { const a = new Uint8Array(buf); let s=''; for(let i=0;i<a.length;i+=0x8000) s += String.fromCharCode.apply(null, a.subarray(i,i+0x8000)); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function deriveKey(pw, salt, iter){
  const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function encryptJSON(key, obj){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, enc.encode(JSON.stringify(obj)));
  return { v:1, iv:b64(iv), ct:b64(ct) };
}
async function decryptJSON(key, box){
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(box.iv)}, key, unb64(box.ct));
  return JSON.parse(dec.decode(pt));
}

/* ================== Durum ================== */
const S = { vault:null, cfg:null, key:null, salt:null, iter:ITER, db:null, sha:null, view:'panel', filters:{}, dirty:false };

/* ================== GitHub API ================== */
const GH = {
  base:'https://api.github.com',
  headers(cfg, raw){ return { Authorization:'Bearer '+cfg.token, Accept: raw ? 'application/vnd.github.raw+json' : 'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28' }; },
  enc(p){ return p.split('/').filter(Boolean).map(encodeURIComponent).join('/'); },
  async req(cfg, url, opt={}, raw=false){
    try {
      const h = this.headers(cfg, raw); if(opt.body) h['Content-Type'] = 'application/json';
      return await fetch(url, {...opt, headers:h, cache:'no-store'});
    } catch { throw new Error("GitHub'a ulaşılamadı. İnternet bağlantınızı kontrol edin."); }
  },
  error(status, m){
    let msg;
    if(status === 401) msg = "GitHub token'ı geçersiz ya da süresi dolmuş.";
    else if(status === 403) msg = 'GitHub erişimi reddetti (token yetkisi yetersiz ya da istek limiti aşıldı). ' + (m||'');
    else if(status === 404) msg = "Depo ya da dosya bulunamadı (veya token'ın bu depoya erişimi yok).";
    else msg = `GitHub hatası (${status}): ${m||''}`;
    const e = new Error(msg.trim()); e.status = status; return e;
  },
  async fail(r){ let m=''; try { m = (await r.json()).message || ''; } catch {} return this.error(r.status, m); },
  async repo(cfg, full){
    const r = await this.req(cfg, `${this.base}/repos/${full}`);
    if(r.status === 404){ const e = new Error(`"${full}" deposu bulunamadı ya da token'ın bu depoya erişimi yok.`); e.status = 404; throw e; }
    if(!r.ok) throw await this.fail(r);
    return r.json();
  },
  async get(cfg, full, path, branch){
    const url = `${this.base}/repos/${full}/contents/${this.enc(path)}` + (branch ? '?ref='+encodeURIComponent(branch) : '');
    const r = await this.req(cfg, url);
    if(r.status === 404) return null;
    if(!r.ok) throw await this.fail(r);
    const j = await r.json();
    if(Array.isArray(j)) throw new Error(`"${path}" bir klasör, dosya değil.`);
    let text;
    if(j.encoding === 'base64') text = dec.decode(unb64((j.content||'').replace(/\s/g,'')));
    else { const r2 = await this.req(cfg, url, {}, true); if(!r2.ok) throw await this.fail(r2); text = await r2.text(); }
    return { text, sha:j.sha };
  },
  async put(cfg, full, path, text, sha, branch, message){
    const body = { message, content: b64(enc.encode(text)) };
    if(sha) body.sha = sha; if(branch) body.branch = branch;
    const r = await this.req(cfg, `${this.base}/repos/${full}/contents/${this.enc(path)}`, {method:'PUT', body:JSON.stringify(body)});
    if(!r.ok){
      let m=''; try { m = (await r.json()).message || ''; } catch {}
      if(r.status === 409 || (r.status === 422 && /sha/i.test(m))){ const e = new Error('Çakışma'); e.conflict = true; throw e; }
      throw this.error(r.status, m);
    }
    return (await r.json()).content.sha;
  }
};
const siteRepo = cfg => `${cfg.owner}/${cfg.repo}`;
const vaultPath = cfg => (cfg.siteDir ? cfg.siteDir + '/' : '') + 'vault.json';
const dataRepo = () => S.cfg.dataRepo || siteRepo(S.cfg);
const dataBranch = () => S.cfg.dataRepo ? null : S.cfg.branch;

/* ================== Kasa (vault) ve veri ================== */
async function fetchVault(){
  let remote = null, local = null;
  try {
    const r = await fetch('vault.json?t=' + Date.now(), {cache:'no-store'});
    if(r.ok){ const j = await r.json(); if(j && j.ct && j.salt) remote = j; }
  } catch {}
  try { const l = lsGet(LS.vault); if(l) local = JSON.parse(l); } catch {}
  if(remote && local) return (local.t||0) > (remote.t||0) ? local : remote;
  return remote || local;
}
async function buildVault(){
  const box = await encryptJSON(S.key, S.cfg);
  return { v:1, kdf:'PBKDF2-SHA256', iter:S.iter, salt:S.salt, iv:box.iv, ct:box.ct, t:Date.now() };
}
async function storeVault(vault){
  S.vault = vault;
  lsSet(LS.vault, JSON.stringify(vault));
  if(S.cfg.storage === 'github'){
    const p = vaultPath(S.cfg);
    const cur = await GH.get(S.cfg, siteRepo(S.cfg), p, S.cfg.branch);
    await GH.put(S.cfg, siteRepo(S.cfg), p, JSON.stringify(vault, null, 1) + '\n', cur && cur.sha, S.cfg.branch, 'Kasa güncellendi');
  }
}
const emptyDb = () => ({ version:1, items:[], deleted:[], updatedAt:new Date().toISOString() });
function normalizeDb(db){
  db.items = Array.isArray(db.items) ? db.items : [];
  db.deleted = Array.isArray(db.deleted) ? db.deleted : [];
  db.items = db.items.filter(it => it && it.id && TYPES[it.type]);
  db.items.forEach(it => { if(!Array.isArray(it.history)) it.history = []; it.history.forEach(h => { if(!h.id) h.id = uid(); }); });
  return db;
}
async function readRemote(){
  if(S.cfg.storage === 'local'){ const t = lsGet(LS.data); return t ? { text:t, sha:null } : null; }
  return GH.get(S.cfg, dataRepo(), S.cfg.dataPath, dataBranch());
}
async function decodeData(text){
  let box; try { box = JSON.parse(text); } catch { throw new Error('Veri dosyası okunamadı (bozuk JSON).'); }
  try { return normalizeDb(await decryptJSON(S.key, box)); }
  catch { throw new Error('Veri dosyası bu şifreyle çözülemedi. Farklı bir şifreyle oluşturulmuş olabilir.'); }
}
async function loadData(){
  const r = await readRemote();
  if(!r){ S.db = emptyDb(); S.sha = null; await saveNow(); return; }
  S.db = await decodeData(r.text); S.sha = r.sha;
}

/* ================== Kaydetme ================== */
let saveTimer = null, saving = Promise.resolve();
function setSaveState(s){
  S.saveState = s;
  const el = $('#saveState'); if(!el) return;
  el.className = 'savestate ' + s;
  el.textContent = { pending:'Kaydedilecek…', saving:'Kaydediliyor…', ok:'Kaydedildi', err:'Kaydedilemedi' }[s] || '';
}
function persist(){
  S.db.updatedAt = new Date().toISOString(); S.dirty = true; setSaveState('pending');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { saving = saving.then(saveNow).catch(()=>{}); }, 500);
}
async function flush(){
  if(saveTimer){ clearTimeout(saveTimer); saveTimer = null; if(S.dirty) saving = saving.then(saveNow).catch(()=>{}); }
  await saving;
}
async function saveNow(){
  saveTimer = null; S.dirty = false; setSaveState('saving');
  const text = JSON.stringify(await encryptJSON(S.key, S.db));
  try {
    if(S.cfg.storage === 'local'){ if(!lsSet(LS.data, text)) throw new Error('Tarayıcı depolamasına yazılamadı.'); }
    else S.sha = await GH.put(S.cfg, dataRepo(), S.cfg.dataPath, text, S.sha, dataBranch(), 'Veri güncellendi');
    setSaveState('ok');
  } catch(e){
    S.dirty = true; setSaveState('err');
    if(e.conflict) showConflict(); else toast(e.message, 'err');
    throw e;
  }
}
function mergeDb(a, b){
  const deleted = new Set([...(a.deleted||[]), ...(b.deleted||[])]);
  const map = new Map();
  for(const it of [...a.items, ...b.items]){
    if(deleted.has(it.id)) continue;
    const cur = map.get(it.id);
    if(!cur || (it.updatedAt||'') > (cur.updatedAt||'')) map.set(it.id, it);
  }
  return { version:1, items:[...map.values()], deleted:[...deleted], updatedAt:new Date().toISOString() };
}
function showConflict(){
  openModal(`<div class="dlg-head"><h2>Veriler başka yerde değişmiş</h2></div>

function setErr(f, m){ const e = f.querySelector('.err'); if(e) e.textContent = m || ''; }
function busy(f, on, label){
  const b = f.querySelector('button[type=submit]'); if(!b) return;
  if(on){ b.dataset.label = b.textContent; b.textContent = label || 'Bekleyin…'; b.disabled = true; }

}

async function onSetup(f){
  const fd = Object.fromEntries(new FormData(f)); setErr(f,'');
  if((fd.pw||'').length < 10) return setErr(f, 'Şifre en az 10 karakter olmalı.');
  if(fd.pw !== fd.pw2) return setErr(f, 'Şifreler eşleşmiyor.');
  let cfg;
  if(fd.storage === 'github'){
    cfg = { storage:'github', owner:fd.owner.trim(), repo:fd.repo.trim(), branch:(fd.branch||'').trim() || 'main',
      siteDir:(fd.siteDir||'').trim().replace(/^\/+|\/+$/g,''), dataRepo:(fd.dataRepo||'').trim().replace(/^https?:\/\/github\.com\//,'').replace(/\/+$/,''),
      dataPath:(fd.dataPath||'').trim().replace(/^\/+/,'') || 'data/akademik.enc.json', token:(fd.token||'').trim() };
    if(!cfg.owner || !cfg.repo) return setErr(f, 'Kullanıcı adı ve depo adı gerekli.');
    if(!cfg.token) return setErr(f, 'GitHub token gerekli.');
    if(cfg.dataRepo && !/^[\w.-]+\/[\w.-]+$/.test(cfg.dataRepo)) return setErr(f, 'Veri deposu "kullanici/depo" biçiminde olmalı.');
  } else cfg = { storage:'local' };
  busy(f, true, 'Kuruluyor…');
  try {
    if(cfg.storage === 'github'){
      await GH.repo(cfg, siteRepo(cfg));
      if(cfg.dataRepo) await GH.repo(cfg, cfg.dataRepo);
    }
    const salt = crypto.getRandomValues(new Uint8Array(16));
    S.key = await deriveKey(fd.pw, salt, ITER); S.salt = b64(salt); S.iter = ITER; S.cfg = cfg;
    await storeVault(await buildVault());
    if(cfg.storage === 'local') lsDel(LS.data);
    await loadData();
    startApp();
    toast(cfg.storage === 'github' ? 'Kurulum tamamlandı. vault.json depoya yazıldı; diğer cihazlarda ~1 dk sonra şifreyle giriş yapabilirsiniz.' : 'Kurulum tamamlandı.');
  } catch(e){ S.key = null; S.cfg = null; setErr(f, e.message); busy(f, false); }
}
async function onLogin(f){
  const pw = f.pw.value; setErr(f,''); if(!pw) return setErr(f, 'Şifre girin.');
  busy(f, true, 'Açılıyor…');
  try {
    const v = S.vault;
    const key = await deriveKey(pw, unb64(v.salt), v.iter || ITER);
    let cfg; try { cfg = await decryptJSON(key, v); } catch { throw new Error('Şifre hatalı.'); }
    S.key = key; S.cfg = cfg; S.salt = v.salt; S.iter = v.iter || ITER;
    lsSet(LS.vault, JSON.stringify(v));
    try { await loadData(); }
    catch(e){ if(e.status === 401 || e.status === 403){ renderTokenRenew(e.message); return; } throw e; }
    startApp();
  } catch(e){ S.key = null; S.cfg = null; setErr(f, e.message); busy(f, false); }
}
async function onRenew(f){
  const token = f.token.value.trim(); setErr(f,''); if(!token) return setErr(f, 'Token girin.');
  busy(f, true, 'Kontrol ediliyor…');

    await GH.repo(S.cfg, siteRepo(S.cfg)); if(S.cfg.dataRepo) await GH.repo(S.cfg, S.cfg.dataRepo);
    await storeVault(await buildVault());
    await loadData(); startApp(); toast('Token güncellendi.');

}

    const by = c => its.filter(i => cat(i) === c).length;
    const chips = CAT_ORDER.filter(c => by(c)).map(c => `<span class="badge c-${c}">${CATS[c]} ${by(c)}</span>`).join('');
    return `<button class="stat" style="--tc:var(--${k})" data-act="view" data-view="${k}">
      <div class="tchip t-${k}">${t.plural}</div><div class="num">${its.length}</div>
      <div class="row">${chips || '<span class="muted small">Henüz kayıt yok</span>'}</div></button>`;
  }).join('');

  const action = items.filter(i => cat(i) === 'action').sort((a,b) => (a.nextDate||'9') < (b.nextDate||'9') ? -1 : 1);
  const dues = items.filter(i => i.nextDate && cat(i) !== 'fail' && daysBetween(T, i.nextDate) <= 30).sort((a,b) => a.nextDate < b.nextDate ? -1 : 1);
  const stale = items.filter(i => cat(i) === 'active' && lastDate(i) && ago(lastDate(i)) >= STALE_DAYS).sort((a,b) => lastDate(a) < lastDate(b) ? -1 : 1);
  const recent = items.flatMap(it => it.history.map(h => ({it,h}))).reverse().sort((a,b) => a.h.d < b.h.d ? 1 : a.h.d > b.h.d ? -1 : 0).slice(0,10);

  const mini = (it, right, sub) => `<button class="mini" data-act="open" data-id="${it.id}">${tchip(it)}
    <span style="min-width:0"><span class="mini-title">${esc(it.title || '(başlıksız)')}</span><span class="mini-sub">${sub ?? esc(it.venue || '')}</span></span>
    <span class="mini-right">${right}</span></button>`;
  const panel = (title, list, empty, n) => `<section class="card panel"><h2>${title}${n ? `<span class="n">${n}</span>` : ''}</h2>${list || `<div class="empty">${empty}</div>`}</section>`;

  return `<div class="page-head"><div><h1>Genel bakış</h1><p class="muted" style="margin:4px 0 0">${items.length ? `${items.length} kayıt · süreci devam eden ${items.filter(i => ['active','action'].includes(cat(i))).length}` : 'Henüz kayıt yok. Sağ üstteki “Yeni kayıt” ile başlayın.'}</p></div></div>
    <div class="stats">${stats}</div>
    <div class="panels">
      ${panel('Aksiyon bekleyenler', action.map(i => mini(i, badge(statusOf(i)))).join(''), 'Sizden bir şey bekleyen süreç yok.', action.length)}
      ${panel('Yaklaşan / geçmiş tarihler', dues.map(i => mini(i, `<span class="${dueCls(i.nextDate)}">${fmt(i.nextDate)}<br>${rel(ago(i.nextDate))}</span>`, esc(i.nextLabel || 'Sonraki tarih'))).join(''), 'Önümüzdeki 30 günde tarih yok.', dues.length)}
      ${panel(`${STALE_DAYS}+ gündür haber yok`, stale.map(i => mini(i, `${ago(lastDate(i))} gün`, `${esc(statusOf(i).t)} · ${esc(i.venue||'')}`)).join(''), 'Uzun süredir sessiz kalan süreç yok.', stale.length)}
      ${panel('Son hareketler', recent.map(({it,h}) => { const st = TYPES[it.type].statuses.find(s => s.k === h.s); return mini(it, fmt(h.d), esc((st ? st.t : h.s) + (h.n ? ' · ' + h.n : ''))); }).join(''), 'Henüz hareket yok.')}
    </div>`;
}

function flt(type){ return S.filters[type] || (S.filters[type] = { q:'', fs:'', sort:'last' }); }
function viewListShell(type){
  const t = TYPES[type], f = flt(type);
  const opts = t.statuses.map(s => `<option value="${s.k}" ${f.fs===s.k?'selected':''}>${esc(s.t)}</option>`).join('');
  return `<div class="page-head"><div><h1>${t.plural}</h1></div>
      <button class="btn primary" data-act="new" data-type="${type}">+ Yeni ${lower(t.label)}</button></div>
    <div class="toolbar">
      <input type="search" id="q" placeholder="Başlık, ${lower(t.venue)}, yazar, not ara…" value="${esc(f.q)}">
      <select id="fs"><option value="">Tüm durumlar</option>
        <optgroup label="Gruplar">${CAT_ORDER.map(c => `<option value="@${c}" ${f.fs==='@'+c?'selected':''}>${CATS[c]}</option>`).join('')}<option value="@open" ${f.fs==='@open'?'selected':''}>Süreci devam edenler</option></optgroup>
        <optgroup label="Durumlar">${opts}</optgroup></select>
      <select id="sort">
        ${[['last','Son harekete göre'],['submit','Gönderim tarihine göre'],['status','Duruma göre'],['title','Başlığa göre']].map(([v,l]) => `<option value="${v}" ${f.sort===v?'selected':''}>${l}</option>`).join('')}
      </select>
    </div>
    <div class="sumrow" id="sumrow"></div>
    <div id="list" class="items"></div>`;
}
function renderList(){
  const type = S.view, f = flt(type), q = lower(f.q).trim();
  const all = S.db.items.filter(i => i.type === type);
  $('#sumrow').innerHTML = CAT_ORDER.map(c => { const n = all.filter(i => cat(i) === c).length; return n ? `<button class="badge c-${c} ${f.fs==='@'+c?'on':''}" data-act="catFilter" data-cat="${c}">${CATS[c]} ${n}</button>` : ''; }).join('');
  let list = all.filter(i => {
    if(f.fs === '@open'){ if(!['active','action'].includes(cat(i))) return false; }
    else if(f.fs.startsWith('@')){ if(cat(i) !== f.fs.slice(1)) return false; }
    else if(f.fs && i.status !== f.fs) return false;
    if(!q) return true;
    return lower([i.title, i.venue, i.refNo, i.coauthors, i.notes, i.doi, i.location].join(' ')).includes(q);
  });
  const by = {
    last:(a,b) => lastDate(b).localeCompare(lastDate(a)),
    submit:(a,b) => (b.submitDate||'').localeCompare(a.submitDate||''),
    title:(a,b) => (a.title||'').localeCompare(b.title||'', 'tr'),
    status:(a,b) => CAT_ORDER.indexOf(cat(a)) - CAT_ORDER.indexOf(cat(b)) || lastDate(b).localeCompare(lastDate(a))
  };
  list.sort(by[f.sort] || by.last);
  $('#list').innerHTML = list.length ? list.map(card).join('') :
    `<div class="emptybox" style="grid-column:1/-1">${all.length ? 'Filtreye uyan kayıt yok.' : `Henüz ${lower(TYPES[type].label)} kaydı yok.`}</div>`;
}
function card(it){

function onItemForm(f){
  const fd = Object.fromEntries(new FormData(f)), id = f.dataset.id, now = new Date().toISOString();
  if(!(fd.title||'').trim()) return toast('Başlık gerekli.', 'err');
  const apply = it => { for(const [k,v] of Object.entries(fd)){ if(k === 'type' && id) continue; const s = String(v).trim(); if(s) it[k] = s; else delete it[k]; } };
  if(!id){
    const it = { id:uid(), createdAt:now, history:[] }; apply(it); it.updatedAt = now;
    it.history.push({ id:uid(), d: it.submitDate || todayISO(), s: it.status, n:'Kayıt oluşturuldu' });
    S.db.items.push(it); closeModal(); persist(); renderMain(); toast('Kayıt eklendi.');
    openDetail(it.id);
  } else {
    const it = find(id); if(!it) return closeModal();
    const prev = it.status; apply(it); it.updatedAt = now;
    if(prev !== it.status){ it.history.push({ id:uid(), d:todayISO(), s:it.status, n:'Durum düzenleme ile değiştirildi' }); sortHist(it); }
    persist(); renderMain(); openDetail(id);
  }
}

function onEvForm(f){
  const it = find(f.dataset.id); if(!it) return;

  it.history.push({ id:uid(), d:fd.d, s:fd.s, n:(fd.n||'').trim() });

  persist(); renderMain(); openDetail(it.id); toast('Güncelleme eklendi.');
}

async function onPwForm(f){
  const fd = Object.fromEntries(new FormData(f)); setErr(f,'');
  if((fd.pw||'').length < 10) return setErr(f, 'Yeni şifre en az 10 karakter olmalı.');
  if(fd.pw !== fd.pw2) return setErr(f, 'Yeni şifreler eşleşmiyor.');
  busy(f, true, 'Değiştiriliyor…');
  try {
    const k = await deriveKey(fd.cur, unb64(S.salt), S.iter);
    try { await decryptJSON(k, S.vault); } catch { throw new Error('Mevcut şifre hatalı.'); }
    await flush();
    const old = { key:S.key, salt:S.salt, iter:S.iter };
    const salt = crypto.getRandomValues(new Uint8Array(16));
    S.key = await deriveKey(fd.pw, salt, ITER); S.salt = b64(salt); S.iter = ITER;
    try { await storeVault(await buildVault()); await saveNow(); }
    catch(e){ Object.assign(S, old); throw e; }
    closeModal(); toast('Şifre değiştirildi.');
  } catch(e){ setErr(f, e.message); busy(f, false); }
}
function tokenModal(){
  openModal(`<form id="tokenForm"><div class="dlg-head"><h2>GitHub token’ını güncelle</h2><button type="button" class="x" data-act="closeModal">×</button></div>
    <div class="dlg-body"><label class="fld"><span>Yeni token</span><input type="password" name="token" placeholder="github_pat_…" autocomplete="off"></label><div class="err"></div></div>
    <div class="dlg-foot"><button type="button" class="btn" data-act="closeModal">Vazgeç</button><button class="btn primary" type="submit">Kaydet</button></div></form>`);
}
async function onTokenForm(f){
  const token = f.token.value.trim(); setErr(f,''); if(!token) return setErr(f, 'Token girin.');
  busy(f, true, 'Kontrol ediliyor…');
  const old = S.cfg.token;
  try {
    S.cfg.token = token;
    await GH.repo(S.cfg, siteRepo(S.cfg)); if(S.cfg.dataRepo) await GH.repo(S.cfg, S.cfg.dataRepo);
    await storeVault(await buildVault());
    closeModal(); toast('Token güncellendi.');
  } catch(e){ S.cfg.token = old; setErr(f, e.message); busy(f, false); }
}
function download(name, text, type){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type})); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function exportCsv(){
  const cols = [['type','Tür'],['title','Başlık'],['venue','Dergi/Kongre/Program'],['status','Durum'],['submitDate','Gönderim'],['refNo','No'],['coauthors','Yazarlar/Ekip'],['index','Dizin'],['role','Rol'],['budget','Bütçe'],['link','Link'],['doi','DOI'],['nextDate','Sonraki tarih'],['nextLabel','Sonraki tarih açıklama'],['notes','Notlar']];
  const cell = v => `"${String(v ?? '').replace(/"/g,'""')}"`;
  const rows = S.db.items.map(it => cols.map(([k]) => k === 'type' ? TYPES[it.type].label : k === 'status' ? statusOf(it).t : it[k]).map(cell).join(';'));
  download(`akademik-${todayISO()}.csv`, '\ufeff' + [cols.map(c => cell(c[1])).join(';'), ...rows].join('\r\n'), 'text/csv;charset=utf-8');
}
async function importFile(file){
  try {
    const j = JSON.parse(await file.text());
    let db;
    if(j && j.ct && j.iv && !j.salt){ try { db = await decryptJSON(S.key, j); } catch { throw new Error('Şifreli yedek bu şifreyle çözülemedi.'); } }
    else db = j;
    if(!db || !Array.isArray(db.items)) throw new Error('Bu dosya geçerli bir yedek değil.');
    db = normalizeDb(db);
    if(!confirm(`${db.items.length} kayıt bulundu. Mevcut verilerle birleştirilsin mi? (Aynı kayıtlarda en son düzenlenen kalır.)`)) return;
    S.db = mergeDb(S.db, db); persist(); renderMain(); toast('İçe aktarıldı.');
  } catch(e){ toast(e.message, 'err'); }
}

/* ================== Kilit ================== */
let lockTimer;
function bumpLock(){ if(!S.key) return; clearTimeout(lockTimer); lockTimer = setTimeout(lock, lockMin()*60000); }
async function lock(msg){
  clearTimeout(lockTimer);
  if(S.db) { try { await flush(); } catch {} }
  S.key = null; S.cfg = null; S.db = null; S.sha = null; S.filters = {};
  closeModal(); renderLogin(typeof msg === 'string' ? msg : 'Oturum kilitlendi.');
}

/* ================== Olaylar ================== */
const ACTS = {
  closeModal:() => closeModal(),
  goSetup:() => renderSetup(true),
  backLogin:() => renderLogin(),
  lock:() => lock(),
  view:el => { S.view = el.dataset.view; closeModal(); renderMain(); window.scrollTo(0,0); },
  new:el => openNew(el.dataset.type),
  open:el => openDetail(el.dataset.id),
  edit:el => { const it = find(el.dataset.id); if(it) openModal(itemFormHtml(it, false), true); },
  delItem:el => { const it = find(el.dataset.id); if(!it || !confirm(`“${it.title}” silinsin mi? Bu işlem geri alınamaz.`)) return;
    S.db.items = S.db.items.filter(i => i.id !== it.id); S.db.deleted.push(it.id); persist(); closeModal(); renderMain(); toast('Silindi.'); },
  delEv:el => { const it = find(el.dataset.id); if(!it || !confirm('Bu süreç adımı silinsin mi?')) return;
    it.history = it.history.filter(h => h.id !== el.dataset.ev); if(it.history.length) it.status = sortHist(it)[it.history.length-1].s;
    it.updatedAt = new Date().toISOString(); persist(); renderMain(); openDetail(it.id); },
  catFilter:el => { const f = flt(S.view), v = '@' + el.dataset.cat; f.fs = f.fs === v ? '' : v; const s = $('#fs'); if(s) s.value = f.fs; renderList(); },
  pwChange:() => pwModal(),
  tokenChange:() => tokenModal(),
  reload:async () => { try { await flush(); await loadData(); renderMain(); toast('Veriler yeniden yüklendi.'); } catch(e){ toast(e.message,'err'); } },
  exportPlain:() => download(`akademik-yedek-${todayISO()}.json`, JSON.stringify(S.db, null, 2), 'application/json'),
  exportCsv:() => exportCsv(),
  importJson:() => $('#importFile').click(),
  forgetDevice:() => { if(!confirm('Bu cihazdaki kasa önbelleği silinsin mi? (GitHub kurulumunda depodaki kasa durur.)')) return;
    lsDel(LS.vault); if(S.cfg.storage === 'local'){ if(!confirm('Yerel modda bu işlem tüm verileri siler. Emin misiniz?')) return; lsDel(LS.data); }
    S.vault = null; lock('Bu cihazdaki kasa silindi.').then(boot); },
  conflictRemote:async () => { try { await loadData(); closeModal(); renderMain(); toast('Uzaktaki sürüm yüklendi.'); } catch(e){ toast(e.message,'err'); } },
  conflictMerge:async () => { try { const r = await readRemote(); if(r){ S.db = mergeDb(await decodeData(r.text), S.db); S.sha = r.sha; } closeModal(); await saveNow(); renderMain(); toast('Birleştirildi ve kaydedildi.'); } catch(e){ toast(e.message,'err'); } }
};
document.addEventListener('click', e => {
  if(e.target.closest('a[href]')) return;
  if(e.target.dataset && e.target.dataset.act === 'backdrop'){ closeModal(); return; }
  const el = e.target.closest('[data-act]:not([data-act=backdrop])'); if(!el) return;
  const fn = ACTS[el.dataset.act]; if(fn){ e.preventDefault(); fn(el, e); }
});
const FORMS = { setupForm:onSetup, loginForm:onLogin, renewForm:onRenew, itemForm:onItemForm, evForm:onEvForm, pwForm:onPwForm, tokenForm:onTokenForm };
document.addEventListener('submit', e => { const fn = FORMS[e.target.id]; if(fn){ e.preventDefault(); fn(e.target); } });
document.addEventListener('input', e => {
  const id = e.target.id; if(!TYPES[S.view]) return;
  if(id === 'q'){ flt(S.view).q = e.target.value; renderList(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if(t.name === 'storage'){ $('#ghFields').classList.toggle('hidden', t.value !== 'github'); return; }
  if(t.name === 'type' && t.form && t.form.id === 'itemForm' && !t.form.dataset.id){ switchFormType(t.form, t.value); return; }
  if(t.id === 'fs' || t.id === 'sort'){ flt(S.view)[t.id] = t.value; renderList(); return; }
  if(t.id === 'lockSel'){ lsSet(LS.lock, t.value); bumpLock(); toast('Kaydedildi.'); return; }
  if(t.id === 'themeSel'){ lsSet(LS.theme, t.value); applyTheme(); return; }
  if(t.id === 'importFile' && t.files[0]){ importFile(t.files[0]); t.value = ''; }
});
document.addEventListener('keydown', e => { if(e.key === 'Escape' && !$('#modal').classList.contains('hidden')) closeModal(); });
['click','keydown','touchstart','scroll'].forEach(ev => document.addEventListener(ev, bumpLock, {passive:true}));
window.addEventListener('beforeunload', e => { if(S.key && (S.dirty || S.saveState === 'saving')){ e.preventDefault(); e.returnValue = ''; } });

function applyTheme(){ const t = lsGet(LS.theme); if(t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; }

async function boot(){
  applyTheme();
  if(!window.crypto || !crypto.subtle){ $app.innerHTML = '<div class="spin">Bu sayfa güvenli bağlantı (https) gerektirir.</div>'; return; }
  $app.innerHTML = '<div class="spin">Yükleniyor…</div>';
  const v = await fetchVault();
  if(!v) return renderSetup(false);
  S.vault = v; renderLogin();
}
boot();
</script>
</body>
</html>
